<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avalon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#090f1c;--fg:#f5ebd4;--card:#172338;--gold:#ddb975;--mut:#a8b1c2;--ok:#60c6a1;--no:#ed8d91;--bd:#39445a;--on:#162134;--shadow:0 15px 45px rgba(0,0,0,.22)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.6 'DM Sans',system-ui,sans-serif;background:radial-gradient(ellipse 65% 35% at 50% -5%,#2c354e 0%,transparent 100%),radial-gradient(ellipse 70% 45% at 110% 65%,#17263b 0%,transparent 80%),#090f1c;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 60h120M60 0v120' stroke='%23b89c6e' stroke-width='.35' opacity='.22'/%3E%3C/svg%3E");background-size:80px 80px}
body:after{content:'✦ ✧ ✦ ✧ ✦ ✧ ✦';position:fixed;left:-15%;right:-15%;top:10%;font:600 14px 'Cinzel',serif;letter-spacing:32px;color:rgba(221,185,117,.12);pointer-events:none;animation:floatRunes 18s linear infinite}
#app{position:relative;max-width:510px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 50px);animation:screenEnter .35s ease}
@keyframes screenEnter{from{opacity:.3;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes floatRunes{0%{transform:translateY(0)}50%{transform:translateY(16px)}100%{transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(221,185,117,0),0 0 0 5px #101a2a}50%{box-shadow:0 0 28px rgba(221,185,117,.28),0 0 0 5px #101a2a}}
@keyframes roleReveal{0%{opacity:0;transform:translateY(12px) scale(.97)}60%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sigilFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cardPop{0%{opacity:0;transform:translateY(15px) rotate(-5deg) scale(.92)}65%{opacity:1;transform:translateY(-2px) rotate(2deg) scale(1.03)}100%{opacity:1;transform:translateY(0) rotate(var(--tilt,0deg)) scale(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes resultGlowGood{0%,100%{box-shadow:0 0 0 rgba(96,198,161,0)}50%{box-shadow:0 0 36px rgba(96,198,161,.22)}}
@keyframes resultGlowBad{0%,100%{box-shadow:0 0 0 rgba(237,141,145,0)}50%{box-shadow:0 0 36px rgba(237,141,145,.22)}}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 0 32px;padding-bottom:14px;border-bottom:1px solid rgba(221,185,117,.21)}
.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font:700 17px 'Cinzel',Georgia,serif;letter-spacing:2px}
.brand-mark{display:grid;place-items:center;border:1px solid rgba(221,185,117,.6);border-radius:50%;width:35px;height:35px;font-size:19px;animation:sigilFloat 4s ease-in-out infinite}
.mast-right{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--mut)}
.hero{text-align:center;margin:8px 0 27px}.eyebrow{text-transform:uppercase;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:3px}
h1,h2,.nm,.section-title{font-family:'Cinzel',Georgia,serif}
h1{font-size:clamp(42px,10vw,58px);line-height:1.12;margin:10px 0;color:var(--fg);letter-spacing:2px;text-shadow:0 3px 22px rgba(221,185,117,.1)}
h2{font-size:clamp(25px,6vw,33px);line-height:1.25;margin:5px 0 17px;letter-spacing:.2px}
h1::after,.hero .ornament{content:'✦ ───── ✧ ───── ✦';display:block;margin:19px auto 0;color:var(--gold);font:12px Georgia,serif;letter-spacing:5px;opacity:.85}
p{margin:8px 0}.mut{color:var(--mut);font-size:13px;line-height:1.7}.hero .mut{max-width:320px;margin:9px auto 0;font-size:14px}
.card{position:relative;background:linear-gradient(145deg,rgba(32,47,70,.97),rgba(18,29,48,.98));border:1px solid rgba(221,185,117,.25);border-radius:17px;padding:21px;margin:15px 0;box-shadow:var(--shadow);overflow:hidden}
.card:before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(221,185,117,.35),transparent 28%,transparent 72%,rgba(221,185,117,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card>b,.card .section-title{display:block;font:600 15px 'Cinzel',Georgia,serif;color:var(--gold);margin-bottom:13px;letter-spacing:.5px}
.card .row b{color:var(--fg)}
.btn,.pick,.step{transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:57px;padding:14px 19px;border:1px solid #efd29a;border-radius:12px;background:linear-gradient(135deg,#f0d69c,#d1a65c,#f0d69c);background-size:200% 100%;color:#172033;font:700 14px 'DM Sans',sans-serif;letter-spacing:.4px;margin:13px 0;box-shadow:0 8px 22px rgba(192,145,68,.18)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 13px 27px rgba(192,145,68,.27);animation:shimmer 2.2s linear infinite}.btn:active:not(:disabled),.step:active,.pick:active{transform:scale(.98)}
.btn.alt{background:rgba(255,255,255,.025);color:var(--fg);border:1px solid var(--bd);box-shadow:none}.btn.alt:hover{background:rgba(255,255,255,.06)}
.btn.ok{background:linear-gradient(135deg,#3f9b7a,#277357);border-color:#63c6a2;color:#fff;box-shadow:none}
.btn.no{background:linear-gradient(135deg,#af5960,#813a46);border-color:#d28791;color:#fff;box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.step:focus-visible,.pick:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
input[type=text]{width:100%;padding:13px 14px;margin:5px 0;border-radius:10px;border:1px solid #36455d;background:#101a2c;color:var(--fg);font:500 14px 'DM Sans',sans-serif;outline:none}
input[type=text]::placeholder{color:#8792a8}input[type=text]:focus{border-color:var(--gold);background:#142036}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{flex:none;width:49px;height:49px;border-radius:13px;border:1px solid rgba(221,185,117,.48);background:#152237;color:var(--gold);font-size:26px}.step:hover{background:#25344c}
.chk{display:flex;gap:12px;align-items:flex-start;margin:11px 0;padding:12px;border:1px solid #37445c;border-radius:11px;background:rgba(13,23,39,.52);font-size:14px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
.chk:hover{transform:translateY(-1px);border-color:rgba(221,185,117,.42);background:rgba(18,29,49,.7)}
.chk input{flex:none;margin-top:3px;width:19px;height:19px;accent-color:#c9a462}
.track{display:flex;justify-content:space-between;gap:7px;margin:23px 0 27px;position:relative}.track:before{content:'';position:absolute;left:8%;right:8%;height:1px;top:50%;background:#46506a;z-index:-1}
.q{width:clamp(45px,12vw,62px);height:clamp(45px,12vw,62px);border-radius:50%;border:1px solid #5a6170;background:#142137;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 20px 'Cinzel',serif;box-shadow:0 0 0 5px #0e1727;transition:transform .2s ease}
.q:hover{transform:translateY(-2px)}
.q small{font:600 8px 'DM Sans',sans-serif;line-height:1.2;letter-spacing:.1px}.q.cur{border:2px solid var(--gold);color:var(--gold);animation:pulseGlow 2.1s ease-in-out infinite}.q.ok{background:#237a60;border-color:#60c6a1;color:#fff}.q.no{background:#8f4050;border-color:#ed8d91;color:#fff}
.role{text-align:center;padding:31px 21px;border-color:rgba(221,185,117,.46);background:radial-gradient(ellipse at top,#2b3b55 0%,#19283f 48%,#111b2e 100%);animation:roleReveal .35s ease}
.role:before{content:'♛';display:block;font-size:35px;color:var(--gold);line-height:1.1;margin:0 0 17px}
.role-sigil-wrap{display:flex;justify-content:center;margin:2px 0 10px}
.role-sigil{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:42px;border:1px solid rgba(221,185,117,.4);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.1),transparent 40%),linear-gradient(160deg,rgba(221,185,117,.18),rgba(255,255,255,.03));box-shadow:inset 0 0 18px rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.2);animation:sigilFloat 4s ease-in-out infinite}
.role-sub{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;border:1px solid rgba(221,185,117,.25);background:rgba(255,255,255,.03);color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.role .nm{font-size:clamp(24px,7vw,33px);font-weight:700;margin:11px 0;line-height:1.28}
.good{color:var(--ok)}.evil{color:var(--no)}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:23px 0}
.vc{width:65px;height:94px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;font-weight:700;border:2px solid #e0caa082;box-shadow:0 6px 15px #0004;transform:rotate(var(--tilt,0deg));animation:cardPop .35s ease both}.vc:nth-child(1){--tilt:-4deg;animation-delay:.02s}.vc:nth-child(2){--tilt:3deg;animation-delay:.08s}.vc:nth-child(3){--tilt:-1deg;animation-delay:.14s}.vc:nth-child(4){--tilt:4deg;animation-delay:.2s}.vc:nth-child(5){--tilt:-3deg;animation-delay:.26s}
.result-banner.good-win{animation:resultGlowGood 2.2s ease-in-out infinite}
.result-banner.evil-win{animation:resultGlowBad 2.2s ease-in-out infinite}
.pick{display:block;width:100%;text-align:left;padding:15px 16px;margin:9px 0;border-radius:11px;border:1px solid #3c4d64;background:#19283d;color:var(--fg);font:500 15px 'DM Sans',sans-serif}.pick:before{content:'◈';margin-right:12px;color:var(--gold)}.pick.sel{border-color:var(--gold);background:#2b3444;box-shadow:inset 0 0 0 1px var(--gold)}
.role-list-name{display:flex;align-items:center;gap:10px}
.mini-sigil{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#101b2f;border:1px solid rgba(221,185,117,.25);font-size:16px;color:var(--gold);flex:none}
ul.rv{list-style:none;padding:0;margin:0}ul.rv li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #344159;font-size:14px}ul.rv li:last-child{border-bottom:0}ul.rv li span:last-child{text-align:right;font-size:12px}
.stage{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:700;margin:3px 0 13px}.progress{height:5px;border-radius:99px;background:#39465b;overflow:hidden;margin:19px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#b78643,#f5dba1);border-radius:99px;transition:width .3s}
.statline{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:10px}.statline strong{font-size:19px;color:var(--gold)}.note{border-left:3px solid var(--gold);padding:10px 13px;margin:16px 0;background:#e0bd7c0b;color:var(--mut);font-size:13px}
.role-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid rgba(221,185,117,.2);margin-top:8px;font-size:13px;color:var(--fg)}
.role-option-mark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#132034;border:1px solid rgba(221,185,117,.3);color:var(--gold);margin-right:8px;font-size:14px;vertical-align:middle}
.footer{text-align:center;color:#77849c;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin:35px 0 10px}
@media(max-width:375px){#app{padding-left:14px;padding-right:14px}.card{padding:16px}.mast-right{letter-spacing:1px}.q{font-size:17px}.role-sigil{width:74px;height:74px;font-size:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ROLES={
merlin:{n:"Merlin",g:1,d:"You know who is evil, except Mordred. Stay hidden or the Assassin will find you.",sigil:"✦",title:"Archmage of Avalon"},
percival:{n:"Percival",g:1,d:"You see Merlin and Morgana, but not which is which. Protect Merlin.",sigil:"🛡",title:"Guardian Knight"},
servant:{n:"Loyal Servant of Arthur",g:1,d:"You know nothing. Work out who to trust.",sigil:"⚔",title:"Knight of the Realm"},
assassin:{n:"Assassin",g:0,d:"If good wins three quests, you get one guess to kill Merlin.",sigil:"🗡",title:"Blade in the Shadows"},
morgana:{n:"Morgana",g:0,d:"Percival sees you as a possible Merlin. Use it.",sigil:"☾",title:"Mistress of Deceit"},
mordred:{n:"Mordred",g:0,d:"Merlin cannot see you.",sigil:"♞",title:"Hidden Heir of Darkness"},
oberon:{n:"Oberon",g:0,d:"You are evil, but you and the other evil players do not know each other.",sigil:"✶",title:"The Unseen Traitor"},
minion:{n:"Minion of Mordred",g:0,d:"Work with your fellow evil players to fail the quests.",sigil:"☠",title:"Servant of Shadows"}};
const DIST={5:[3,2],6:[4,2],7:[4,3],8:[5,3],9:[6,3],10:[6,4]};
const QS={5:[2,3,2,3,3],6:[2,3,4,3,4],7:[2,3,3,4,4],8:[3,4,4,5,5],9:[3,4,4,5,5],10:[3,4,4,5,5]};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S={scr:"setup",n:5,names:[],opt:{pm:true,mordred:false,oberon:false}};
const nm=i=>(S.names[i]||"").trim()||"Player "+(i+1);
const evilSpec=()=>["assassin"].concat(S.opt.pm?["morgana"]:[],S.opt.mordred?["mordred"]:[],S.opt.oberon?["oberon"]:[]);
const rs=k=>ROLES[k].sigil;

function start(){
 const [g,e]=DIST[S.n],o=S.opt;
 const good=["merlin"].concat(o.pm?["percival"]:[]);while(good.length<g)good.push("servant");
 const ev=evilSpec();while(ev.length<e)ev.push("minion");
 const roles=shuf(good.concat(ev));
 S.players=roles.map((r,i)=>({name:nm(i),role:r}));
 Object.assign(S,{scr:"pass",i:0,shown:false,q:0,res:[],rej:0,leader:Math.floor(Math.random()*S.n)});
 render();
}
function info(p){
 const P=S.players,ev=P.filter(x=>!ROLES[x.role].g);
 const L=a=>a.map(x=>esc(x.name)).join(", ");
 if(p.role=="merlin")return "Evil players: "+L(ev.filter(x=>x.role!="mordred"));
 if(p.role=="percival")return "Merlin and Morgana (one each, order shuffled): "+L(shuf(P.filter(x=>x.role=="merlin"||x.role=="morgana")));
 if(!ROLES[p.role].g&&p.role!="oberon"){const o=ev.filter(x=>x!==p&&x.role!="oberon");return o.length?"Fellow evil players: "+L(o):"You have no visible allies."}
 return "You have no special information.";
}
function track(){
 return '<div class="track">'+QS[S.n].map((c,i)=>{const r=S.res[i];
  return `<div class="q ${r==="s"?"ok":r==="f"?"no":""} ${i==S.q&&r===undefined?"cur":""}">${r==="s"?"✓":r==="f"?"✗":c}${i==3&&S.n>=7&&r===undefined?"<small>2 fails</small>":""}</div>`}).join("")+"</div>";
}
function render(){
 const f=window["scr_"+S.scr];app.innerHTML=`<header class="masthead"><div class="brand"><span class="brand-mark">♜</span> AVALON</div><span class="mast-right">THE QUEST FOR ARTHUR</span></header>`+f()+`<footer class="footer">✦ &nbsp; HONOUR · DECEPTION · DESTINY &nbsp; ✦</footer>`;
}
window.scr_setup=()=>{
 const need=DIST[S.n],bad=evilSpec().length>need[1];
 let inputs="";for(let i=0;i<S.n;i++)inputs+=`<input type="text" aria-label="Player ${i+1}" placeholder="Player ${i+1}" value="${esc(S.names[i]||"")}" oninput="S.names[${i}]=this.value">`;
 return `<div class="hero"><div class="eyebrow">Enter the kingdom</div><h1>AVALON</h1><p class="mut">Gather your knights. Conceal your allegiance. Decide the fate of the realm.</p></div>
 <div class="card"><b>01 / YOUR ROUND TABLE</b><div class="row"><button class="step" onclick="cnt(-1)" aria-label="Fewer players">−</button><div style="text-align:center"><b style="font-size:26px">${S.n} players</b><div class="mut">${need[0]} good, ${need[1]} evil</div></div><button class="step" onclick="cnt(1)" aria-label="More players">+</button></div></div>
 <div class="card"><b>02 / THE KNIGHTS</b><p class="mut">Name each player before dealing secret roles.</p>${inputs}</div>
 <div class="card"><b>03 / SHADOWS & SECRETS</b>
 <p class="mut">Merlin and the Assassin are always in.</p>
 <label class="chk"><input type="checkbox" ${S.opt.pm?"checked":""} onchange="tg('pm')"><span><span class="role-option-mark">${rs('percival')}</span>Percival and Morgana <span class="mut" style="display:block;margin-top:4px">Protect Merlin, or pretend to be him.</span></span></label>
 <label class="chk"><input type="checkbox" ${S.opt.mordred?"checked":""} onchange="tg('mordred')"><span><span class="role-option-mark">${rs('mordred')}</span>Mordred<br><span class="mut">Hidden from Merlin</span></span></label>
 <label class="chk"><input type="checkbox" ${S.opt.oberon?"checked":""} onchange="tg('oberon')"><span><span class="role-option-mark">${rs('oberon')}</span>Oberon<br><span class="mut">Evil, but unknown to the other evil players</span></span></label>
 ${bad?`<p class="evil">Too many evil roles for ${S.n} players. Turn one off.</p>`:""}</div>
 <button class="btn" ${bad?"disabled":""} onclick="start()">✦ &nbsp; Deal secret roles</button>`;
};
function cnt(d){S.n=Math.min(10,Math.max(5,S.n+d));render()}
function tg(k){S.opt[k]=!S.opt[k];render()}
window.scr_pass=()=>{
 const p=S.players[S.i],R=ROLES[p.role];
 if(!S.shown)return `<div class="stage">Secret identity · ${S.i+1} of ${S.n}</div><h2>Pass the device to ${esc(p.name)}</h2><div class="progress"><span style="width:${S.i/S.n*100}%"></span></div><div class="note">Make sure nobody else is looking before revealing the role.</div><button class="btn" onclick="S.shown=true;render()">I’m ${esc(p.name)}, show my role</button>`;
 return `<div class="card role"><div class="role-sigil-wrap"><div class="role-sigil">${R.sigil}</div></div><div class="role-sub">${R.title}</div><p class="mut" style="margin-top:16px">${esc(p.name)}, you are</p><div class="nm ${R.g?"good":"evil"}">${R.n}</div><p class="${R.g?"good":"evil"}">${R.g?"Good":"Evil"}</p><p>${R.d}</p><div class="role-chip"><span>${R.sigil}</span><span>Character Emblem</span></div><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><p>${info(p)}</p></div>
 <button class="btn" onclick="nextPass()">Hide and pass on</button>`;
};
function nextPass(){S.shown=false;S.i++;if(S.i>=S.n)S.scr="board";render()}
window.scr_board=()=>{
 const size=QS[S.n][S.q];
 return `<div class="stage">The round table · Chapter ${S.q+1} of 5</div><h2>Quest ${S.q+1}</h2>${track()}
 <div class="card"><b>THE QUEST LEADER</b><div class="statline"><span>Leader</span><strong>${esc(S.players[S.leader].name)}</strong></div><div class="statline"><span>Team size</span><strong>${size} Knights</strong></div>
 <p class="mut">${S.q==3&&S.n>=7?"This quest needs two fails to fail.":"One fail is enough to fail this quest."}</p></div>
 <button class="btn" onclick="startVote()">Team approved, start quest vote</button>
 <button class="btn alt" onclick="reject()">Team rejected (${S.rej}/5)</button>
 <p class="note">Five rejected teams in a row and evil wins.</p>`;
};
function reject(){S.rej++;S.leader=(S.leader+1)%S.n;if(S.rej>=5){S.win="evil";S.why="Five teams were rejected in a row.";S.scr="end"}render()}
function startVote(){S.v={list:[],open:false,total:QS[S.n][S.q]};S.scr="vote";render()}
window.scr_vote=()=>{
 const v=S.v,k=v.list.length+1;
 if(!v.open)return `<div class="stage">Secret quest ballot</div><h2>Quest ${S.q+1} · Vote ${k}/${v.total}</h2><div class="progress"><span style="width:${v.list.length/v.total*100}%"></span></div><div class="note">Pass the device to a quest team member. All votes remain anonymous.</div><button class="btn" onclick="S.v.open=true;render()">I’m on the team, show my vote</button>`;
 return `<div class="stage">Your secret decision</div><h2>Choose your fate</h2><p class="note">Loyal knights must choose success. Evil players may choose either option.</p>
 <button class="btn ok" onclick="cast('s')">Success</button><button class="btn no" onclick="cast('f')">Fail</button>`;
};
function cast(x){const v=S.v;v.list.push(x);v.open=false;if(v.list.length>=v.total){v.sh=shuf(v.list);S.scr="result"}render()}
window.scr_result=()=>{
 const sh=S.v.sh,fails=sh.filter(x=>x=="f").length,need=(S.q==3&&S.n>=7)?2:1,failed=fails>=need;
 S.v.failed=failed;
 return `<div class="stage">The verdict</div><h2>Quest ${S.q+1} result</h2>
 <div class="cards">${sh.map(x=>`<div class="vc" style="background:var(--${x=="s"?"ok":"no"})">${x=="s"?"✓":"✗"}</div>`).join("")}</div>
 <div class="card role result-banner ${failed?"evil-win":"good-win"}"><div class="nm ${failed?"evil":"good"}">${failed?"Quest failed":"Quest succeeded"}</div><p class="mut">${fails} fail${fails==1?"":"s"}, ${sh.length-fails} success${sh.length-fails==1?"":"es"}</p></div>
 <button class="btn" onclick="after()">Continue</button>`;
};
function after(){
 S.res[S.q]=S.v.failed?"f":"s";
 const g=S.res.filter(x=>x=="s").length,e=S.res.filter(x=>x=="f").length;
 if(e>=3){S.win="evil";S.why="Three quests failed.";S.scr="end"}
 else if(g>=3){S.scr="kill";S.pick=null}
 else{S.q++;S.leader=(S.leader+1)%S.n;S.rej=0;S.scr="board"}
 render();
}
window.scr_kill=()=>{
 const a=S.players.find(p=>p.role=="assassin");
 return `<div class="stage">The final reckoning</div><h2>Three quests succeeded</h2>${track()}<p>Good is one step from winning. The Assassin (<b>${esc(a.name)}</b>) now picks who they think is Merlin. Discuss quietly, then choose.</p>
 ${S.players.map((p,i)=>`<button class="pick ${S.pick===i?"sel":""}" onclick="S.pick=${i};render()">${esc(p.name)}</button>`).join("")}
 <button class="btn" ${S.pick===null?"disabled":""} onclick="kill()">Confirm pick</button>`;
};
function kill(){
 const m=S.players[S.pick];
 if(m.role=="merlin"){S.win="evil";S.why=m.name+" was Merlin. The Assassin found him."}
 else{S.win="good";S.why=m.name+" was not Merlin. Merlin stays hidden."}
 S.scr="end";render();
}
window.scr_end=()=>`<div class="stage">The legend concludes</div><h2>${S.win=="good"?"Good wins":"Evil wins"}</h2><p class="${S.win=="good"?"good":"evil"}"><b>${esc(S.why)}</b></p>${track()}
 <div class="card"><b>Roles</b><ul class="rv">${S.players.map(p=>`<li><div class="role-list-name"><span class="mini-sigil">${ROLES[p.role].sigil}</span><span>${esc(p.name)}</span></div><span class="${ROLES[p.role].g?"good":"evil"}">${ROLES[p.role].n}</span></li>`).join("")}</ul></div>
 <button class="btn" onclick="S.scr='setup';render()">Play again</button>`;
render();
</script>
</body>
</html>
